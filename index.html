<!DOCTYPE html>

    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700;900&family=Fraunces:wght@600;700&display=swap"

    />

  <body>
    <div class="page-shell">
      <header class="header-top">
        <div class="logo">N</div>
        <button class="lang-toggle" id="langToggle" aria-label="Toggle language">
          <span class="lang-text">ENG</span>
        </button>
      </header>

      <div class="hero">
        <div class="brand-mark">🍜</div>
        <div class="intro-text">
          <p class="eyebrow" data-zh="憩息 · Nodals" data-en="Nod · A Space to Rest">憩息 · Nodals</p>
          <h1 data-zh="汪鑿鑄" data-en="Zuricast Wang">汪鑿鑄</h1>

        <section class="tags" aria-label="Keywords">
          <span data-zh="打盹" data-en="Doze">打盹</span>
          <span data-zh="閱讀" data-en="Read">閱讀</span>
          <span data-zh="寫字" data-en="Write">寫字</span>
          <span data-zh="想法" data-en="Thoughts">想法</span>
          <span data-zh="安靜" data-en="Quiet">安靜</span>
        </section>

        <section class="links">
          <a href="https://github.com/ZuriGame123" target="_blank" rel="noreferrer" data-zh="GitHub" data-en="GitHub">GitHub</a>
          <a href="mailto:zurigame123@example.com" data-zh="寄信" data-en="Email">寄信</a>
